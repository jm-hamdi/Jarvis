name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Qualité du code Python ──────────────────────────────
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check . --select E9,F63,F7,F82,F401,F841

  # ── 2. Build des 2 frontends React ────────────────────────
  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, sys-pai/pay-front]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── 3. Tests Playwright du dashboard ──────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: frontends
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/

  # ── 4. Build des images Docker (CD : push sur main) ───────
  docker:
    runs-on: ubuntu-latest
    needs: [python-lint, frontends]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: backend,      path: backend }
          - { name: frontend,     path: frontend }
          - { name: pay-front,    path: sys-pai/pay-front }
          - { name: payment-api,  path: sys-pai/payment-api }
          - { name: auth-service, path: sys-pai/auth-service }
          - { name: detector,     path: ia-auto/detector }
          - { name: remediator,   path: ia-auto/remediator }
          - { name: verifier,     path: ia-auto/verifier }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/jm-hamdi/jarvis-${{ matrix.service.name }}:latest
            ghcr.io/jm-hamdi/jarvis-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
