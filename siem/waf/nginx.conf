events { worker_connections 1024; }

http {
    include /etc/nginx/banned_ips.conf;

    upstream payment_api  { server jarvis-payment-api:8000; }
    upstream auth_service { server jarvis-auth-service:8001; }

    server {
        listen 80;

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location /payments {
            if ($blocked_ip) { return 403 "Blocked by JARVIS WAF\n"; }
            proxy_pass http://payment_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth/ {
            if ($blocked_ip) { return 403 "Blocked by JARVIS WAF\n"; }
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
